<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Top Trumps</title>
  
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="app-container">
    <header>
      <h1>Top Trumps</h1>
      <div id="room-ui">
        <button id="create-room-btn">Create Room</button>
        <input type="text" id="room-code-input" placeholder="Enter Code">
        <button id="join-room-btn">Join</button>
      </div>
    </header>

  <main id="game-board" class="hidden">
        <div id="game-status" class="status-banner">Waiting for opponent...</div>
        
        <div class="opponent-area">
          <div class="card-back">
            <p>Opponent Cards: <span id="opponent-count">0</span></p>
          </div>
        </div>
  
        <div class="player-area">
          <p class="deck-count">Your Cards: <span id="player-count">0</span></p>
          
          <div id="active-card" class="card">
            <h2 id="card-name">Dragon Name</h2>
            <div class="card-image-placeholder">🐉</div>
            
            <div class="card-stats" id="stat-buttons-container">
              <!-- Stat buttons will be injected here by JavaScript -->
            </div>
          </div>
        </div>
      </main>
    </div>

  <script type="module" src="app.js"></script>
</body>
</html>
